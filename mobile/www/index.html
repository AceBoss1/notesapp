<body style="margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#FBF6F2;color:#1A1210;font-family:system-ui,sans-serif;text-align:center">
  <div><p style="font-size:20px;font-weight:700;color:#7A0328">#NotesApp</p><p>You're offline. Connect to the internet and try again.</p>
