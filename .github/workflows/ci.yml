name: CI
on:
  pull_request:
  push:
    branches: [main, staging]

# Every pull request: types, the settings list, every test suite, a production build and the smoke test against it.
# Staging and releases: docs/STAGING.md.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx -y tsx scripts/settings-doc.ts --check
      - run: npm run test:rules
      - run: npm run test:life
      - run: npm run test:messages
      - run: npm run test:mentions
      - run: npm run test:digest
      - run: npm run test:authors
      - run: npm run test:shared
      - run: npm run test:topics
      - run: npm run test:nana
      - run: npm run test:certificates
      - run: npm run test:discovery
      - run: npm run test:courses
      - run: npm run test:social
      - run: npm run test:team
      - run: npm run test:chat
      - run: npm run test:uploads
      - run: npm run test:cart
      - run: npm run test:mcp
      - run: npm run test:pricing
      - run: npm run test:ads
      - run: npm run test:cardtap
      - run: npm run test:kiswahili
      - run: npm run test:exam-prep
      - run: npm run test:life-social
      - run: npm run test:young
      - run: npm run test:prep-schools
      - run: npm run test:kids
      - run: npm run test:time
      - run: npm run test:invoices
      - run: npm run test:shipments
      - run: npm run test:logistics
      - run: npm run test:calls
      - run: npm run test:analytics
      - run: npm run test:sites
      - run: npm run test:trials
      - run: npm run test:inventory
      - run: npm run test:community
      - run: npm run test:courses-server
      - run: npm run test:team-server
      - run: npm run test:maintenance
      - run: npm run test:credits
      - run: npm run test:cardtap-server
      - run: npm run test:kiswahili-server
      - run: npm run test:exam-prep-server
      - run: npm run test:life-social-server
      - run: npm run test:young-server
      - run: npm run test:prep-schools-server
      - run: npm run test:kids-server
      - run: npm run test:time-server
      - run: npm run test:invoices-server
      - run: npm run test:certificates-server
      - run: npm run test:nana-server
      - run: npm run test:mcp-server
      - run: npm run test:shipments-server
      - run: npm run test:logistics-server
      - run: npm run test:cart-server
      - run: npm run test:calls-server
      - run: npm run test:analytics-server
      - run: npm run test:sites-server
      - run: npm run test:trials-server
      - run: npm run test:inventory-server
      - run: npm run test:community-server
      # the link-preview safety test listens on port 80, which needs root on the runner
      - run: sudo -E env "PATH=$PATH" npx -y tsx tests/link-preview/safety.ts

  # Secret scanning: the whole history, every pull request and push (a few seconds). Fails on anything that looks like a key or
  # token; values are redacted in the log. Known non-secrets are listed in .gitleaks.toml. A real leak means rotating the key
  # first (docs/DEPLOY.md), then removing it from the code.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache: false }
      # Pinned; the Go checksum database verifies the module.
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: "$(go env GOPATH)/bin/gitleaks git --config .gitleaks.toml --redact --no-banner --verbose ."

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: checks
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_FIREBASE_API_KEY: x
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-notesapp
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: x
      NEXT_PUBLIC_FIREBASE_APP_ID: x
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      GCLOUD_PROJECT: demo-notesapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # A throwaway service account (the emulator doesn't check it), so server routes start as they do on Vercel.
      - name: Dummy service account
        run: |
          openssl genrsa 2048 > key.pem
          node -e 'const fs=require("fs");fs.writeFileSync("sa.json",JSON.stringify({type:"service_account",project_id:"demo-notesapp",private_key_id:"x",private_key:fs.readFileSync("key.pem","utf8"),client_email:"ci@demo-notesapp.iam.gserviceaccount.com",client_id:"1",token_uri:"https://oauth2.googleapis.com/token"}))'
          echo "FIREBASE_SERVICE_ACCOUNT_KEY=$(cat sa.json)" >> "$GITHUB_ENV"
      - name: Build, start and smoke test (with the Firestore emulator)
        run: |
          npx -y firebase-tools@13 emulators:exec --only firestore --project demo-notesapp \
            "npx next build && (npx next start -p 3000 & npx -y wait-on@8 http://127.0.0.1:3000/robots.txt && npm run test:smoke)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results, retention-days: 7 }
