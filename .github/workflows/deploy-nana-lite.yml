name: Deploy Nana Lite
# The Nana Lite worker (workers/nana-lite: three small models in Cloudflare Containers behind one Worker; docs/NANA_LITE.md). Runs by hand
# (Actions → Deploy Nana Lite → Run workflow) and on pushes to main that change the worker. Uses the same repository secrets as the
# live-rooms deploy: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus Containers: Edit) and CLOUDFLARE_ACCOUNT_ID. Without them the job
# says so and stops, green. If the repository also has a NANA_LITE_KEY secret, it is set on the worker; otherwise set it once by hand:
# cd workers/nana-lite && npx wrangler secret put NANA_LITE_KEY (the same value as NANA_LITE_KEY on Vercel). Containers need the
# Workers Paid plan.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/nana-lite/**"
      - ".github/workflows/deploy-nana-lite.yml"

concurrency: { group: deploy-nana-lite, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_SECRET: ${{ secrets.NANA_LITE_KEY != '' }}
    steps:
      - name: No Cloudflare keys yet
        if: env.HAS_KEYS != 'true'
        run: echo "::notice title=Nana Lite not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then run this workflow again. Nothing was deployed."
      - uses: actions/checkout@v4
        if: env.HAS_KEYS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEYS == 'true'
        with: { node-version: 22 }
      - name: Install and type-check the worker
        if: env.HAS_KEYS == 'true'
        working-directory: workers/nana-lite
        run: npm install --legacy-peer-deps --no-audit --no-fund && npx -y -p typescript@5.9.3 tsc -p .
      - name: Deploy (builds the three model images with Docker and pushes them to Cloudflare)
        if: env.HAS_KEYS == 'true'
        working-directory: workers/nana-lite
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set NANA_LITE_KEY on the worker (only if the repository has it)
        if: env.HAS_KEYS == 'true' && env.HAS_SECRET == 'true'
        working-directory: workers/nana-lite
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NANA_LITE_KEY: ${{ secrets.NANA_LITE_KEY }}
        run: printf '%s' "$NANA_LITE_KEY" | npx wrangler secret put NANA_LITE_KEY
      - name: Remind about the key
        if: env.HAS_KEYS == 'true' && env.HAS_SECRET != 'true'
        run: echo "::notice title=Nana Lite deployed::Set the worker's key once with npx wrangler secret put NANA_LITE_KEY (workers/nana-lite), the same value as NANA_LITE_KEY on Vercel."
